version: "3"
services:
  streamlit-app:
    image: the_family_allocation/web-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-front
    restart: unless-stopped
    ports:
      - "8501:8501"
    # Load secrets from repo-root .env (never commit that file).
    # Do not set EMAIL_PASSWORD=${EMAIL_PASSWORD:-} here — an empty
    # substitution overrides env_file and breaks Gmail auth.
    env_file:
      - ../.env
    environment:
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-teacher.scheduler.contact@gmail.com}
